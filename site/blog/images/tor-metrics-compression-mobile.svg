<svg xmlns="http://www.w3.org/2000/svg" width="338" height="508" viewBox="0 0 338 508" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Compressed size of reconstructed Tor scrapes</title>
<desc id="chart-desc">Grouped horizontal bars compare zstd level 3 without a dictionary and with a raw dictionary for Relay A and Relay B. Every bar uses the same linear scale from zero to 35 MB.</desc>
